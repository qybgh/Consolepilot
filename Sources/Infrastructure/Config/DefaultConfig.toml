# Consolepilot 默认配置。所有说明均为中文；密钥只能引用钥匙串或环境变量。

[general]
# 本地 HTTP 服务监听端口（1024–65535）
port = 8765
# 主题：tokyo-night / solarized-dark / nord / mono
theme = "tokyo-night"
# 窗口不透明度（0.75–1.0）
opacity = 0.92
# 是否始终置顶
alwaysOnTop = true
# 正文字体名称
fontName = "SF Mono"
# 正文​​字号
fontSize = 13
# 窄屏模式字号
compactFontSize = 11
# 最多保留的滚动历史行数
scrollbackLines = 100000
# 是否允许远程 Profile 访问真实 API；默认关闭以避免验收期间消耗 Token
allowRealProvider = false

[server]
# 可选：本地 CLI/HTTP 服务鉴权 Token 引用；留空表示不启动本地服务
authToken = ""
# 单次 HTTP 请求体大小上限（字节，启用本地服务时生效）
maxBodyBytes = 1048576

[capture]
# 捕获策略按顺序尝试：accessibility / simulatedCopy / clipboard
strategy = ["accessibility", "simulatedCopy", "clipboard"]
# 模拟复制前等待时间（毫秒）
simulatedCopyWait = 120
# 捕获完成后是否恢复原剪贴板
restoreClipboard = true
# 捕获文本最大字符数
maxInputChars = 40000
# 不触发捕获的应用 Bundle ID
excludeBundleIds = ["com.apple.keychainaccess", "com.agilebits.onepassword7"]
