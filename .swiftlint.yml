strict: true

included:
  - Sources
  - Tests
excluded:
  - Sources/Generated
  # ConsolepilotRootView 为 P2 SwiftUI 迁移的整体删除对象（P0-B 起转存 LegacyUI 过渡模块），
  # 其 1120 行/巨型函数属已知遗留，重构成本高且生命周期短，暂豁免结构性长度规则。
  - Sources/LegacyUI/Presentation/ConsolepilotRootView.swift

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - empty_count
  - empty_string
  - force_unwrapping
  - fatal_error_message
  - first_where
  - sorted_first_last

disabled_rules:
  - todo
  # 以下规则与 swift-format（格式权威）输出冲突，规范要求以 swift-format 为准。
  - closure_parameter_position
  - opening_brace
  - trailing_comma

line_length:
  warning: 120
  error: 140
  ignores_comments: false
  ignores_urls: true

file_length:
  warning: 600
  error: 800

type_body_length:
  warning: 450
  error: 600

function_body_length:
  warning: 80
  error: 120

function_parameter_count:
  warning: 5
  error: 6

cyclomatic_complexity:
  warning: 15
  error: 20

# GRDB 惯用闭包参数 db / 迁移缩写 t 为框架标准写法，全仓库沿用。
identifier_name:
  min_length: 2
  max_length: 60
  excluded:
    - db
    - t

custom_rules:
  no_todo_markers:
    name: "禁止遗留标记"
    regex: "(TODO|FIXME|XXX|HACK|WIP)"
    message: "提交前必须清除遗留标记"
    severity: error
  no_print:
    name: "禁止 print"
    regex: "(?<!\\.)\\b(print|debugPrint|dump)\\s*\\("
    message: "使用 Log 而非 print（CLI 用户输出除外）"
    severity: error
  no_force_try:
    name: "禁止 try!"
    regex: "try!"
    message: "禁止 try!，显式处理错误"
    severity: error
